site_name: CS422/CS423 Blockchain Technologies
site_description: Blockchain Technologies course materials, labs, assignments and exams
site_url: https://cibran2311.github.io/Newuuz-Blockchain/
repo_url: https://github.com/Cibran2311/Newuuz-Blockchain
repo_name: Cibran2311/Newuuz-Blockchain
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: green
      accent: teal
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.path
    - toc.follow
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
nav:
  - Introduction: index.md
  - Syllabus: syllabus.md
  - Education:
      - Course Map: education/course-map.md
      - Labs Overview: education/labs.md
      - Assignments Overview: education/assignments.md
      - Exams: education/exams.md
  - Labs:
      - Lab 1 — First Transaction / Faucet / Wallet: labs/lab1-first-transaction.md
      - Lab 2 — Hash Function and Collision: labs/lab2-hash-collision.md
      - Lab 3 — Merkle Tree and Block Mining: labs/lab3-merkle-mining.md
      - Lab 4 — Ethereum Transaction and Gas: labs/lab4-ethereum-transaction-gas.md
      - Lab 5 — ERC20 Token and Disperse: labs/lab5-erc20-disperse.md
      - Lab 6 — NFT Trading and Special Contract: labs/lab6-nft-special-contract.md
      - Lab 7 — DEX Arbitrage Racing Game: labs/lab7-dex-arbitrage-racing.md
      - Lab 8 — Polkadot Transaction: labs/lab8-polkadot-transaction.md
      - Lab 9 — Polkadot AssetHub and XCM: labs/lab9-assethub-xcm.md
      - Lab 10 — TON Transaction: labs/lab10-ton-transaction.md
      - Lab 11 — Jetton / TON NFT: labs/lab11-jetton-ton-nft.md
      - Lab 12 — TON DEX / HackTON: labs/lab12-ton-dex-hackton.md
  - Assignments:
      - Assignment 1 — NFT Trading + Special Contract: assignments/assignment1-nft-trading-special-contract.md
      - Assignment 2 — Ethernaut: assignments/assignment2-ethernaut.md
      - Assignment 3 — Multi-chain Contract Chain: assignments/assignment3-multichain-contract-chain.md
      - Assignment 4 — Technical Article: assignments/assignment4-technical-article.md
  - Grading:
      - Grading Model: grading/grading-model.md
      - JSON Submission Format: grading/json-submission-format.md
      - GitHub Classroom and Actions: grading/github-classroom-actions.md
      - Auto-check Roadmap: grading/auto-check-roadmap.md
  - Platform:
      - On-chain Grading Platform: platform/on-chain-grading-platform.md
      - Student Portfolio Concept: platform/student-portfolio.md
  - Templates:
      - Lab Report Template: course-templates/lab-report-template.md
      - Assignment Submission Template: course-templates/assignment-submission-template.md
