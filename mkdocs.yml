site_name: CS422/CS423 Blockchain Technologies
site_description: Practical Blockchain Technologies course
site_url: https://cibran2311.github.io/Newuuz-Blockchain/
repo_url: https://github.com/Cibran2311/Newuuz-Blockchain
repo_name: Cibran2311/Newuuz-Blockchain
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.path
    - toc.follow
    - content.code.copy
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Course:
      - Overview: course/overview.md
      - Roadmap: course/roadmap.md
      - Difficulty Levels: course/difficulty-levels.md
      - Syllabus: course/syllabus.md
      - Learning Outcomes: course/learning-outcomes.md
      - How to Study: course/how-to-study.md
  - Required Labs:
      - Section 1 — Blockchain Foundations: sections/foundations.md
      - Lab 1 / Mission 1 — Enter the Blockchain: labs/lab1-wallet-first-transaction.md
      - Lab 2 / Mission 2 — Hash Detective: labs/lab2-hash-functions-collisions.md
      - Lab 3 / Mission 3 — Mine Your First Block: labs/lab3-merkle-trees-mining.md
      - Section 2 — Ethereum and Smart Contracts: sections/ethereum.md
      - Lab 4 / Mission 4 — Read the Chain: labs/lab4-ethereum-transactions-gas.md
      - Lab 5 / Mission 5 — Launch Your Token: labs/lab5-erc20-disperse.md
      - Lab 6 / Mission 6 — Create and Move NFTs: labs/lab6-nft-smart-contracts.md
      - Section 3 — Alternative Ecosystems: sections/alternative-ecosystems.md
      - Section 3A — Polkadot: sections/polkadot.md
      - Lab 8 / Mission 8 — Enter Polkadot: labs/lab8-polkadot-transactions.md
      - Section 3B — TON: sections/ton.md
      - Lab 10 / Mission 10 — Enter TON: labs/lab10-ton-transactions.md
  - Required Assignments:
      - Overview: assignments/index.md
      - Assignment 3 — Group Chain of Contracts: assignments/assignment3-cross-chain-interaction.md
      - Assignment 4 — Web3 Technical Article: assignments/assignment4-technical-article.md
  - Additional Challenges:
      - Overview: challenges/index.md
      - Lab 7 / Challenge — Trade Like a DeFi Bot: labs/lab7-amm-dex-arbitrage.md
      - Lab 9 / Challenge — Send a Cross-chain Message: labs/lab9-assethub-xcm.md
      - Lab 11 / Challenge — Dissect a Jetton Transfer: labs/lab11-jettons-ton-nfts.md
      - Lab 12 / Challenge — Trade or Break on TON: labs/lab12-ton-defi-security.md
      - Challenge Assignment — NFT Quest: assignments/assignment1-nft-trading.md
      - Challenge Assignment — Security Arena: assignments/assignment2-ethernaut.md
  - Grading:
      - How to Submit: grading/how-to-submit.md
      - Protected Google Sheets Registry: grading/google-sheets-registry.md
      - Auto-check System: grading/autocheck.md
      - Instructor Setup: grading/autotest-setup.md
      - Classroom and GitHub: grading/github-classroom.md
      - Deadline-gated Checks: grading/deadline-gated-checks.md
  - References:
      - Reading Roadmap: references/reading-roadmap.md
      - Ethereum & EVM: references/ethereum.md
      - Solidity & OpenZeppelin: references/solidity-openzeppelin.md
      - DeFi & Uniswap: references/defi-uniswap.md
      - Polkadot & XCM: references/polkadot-xcm.md
      - TON & STON.fi: references/ton-stonfi.md
      - Security Platforms: references/security-platforms.md
  - Resources:
      - Useful Links: resources/links.md
      - Wallets and Explorers: resources/wallets.md
      - Common Mistakes: resources/common-mistakes.md
