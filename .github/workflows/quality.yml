name: Course Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-autotest.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-autotest.txt

      - name: Run checker unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build MkDocs strictly
        run: mkdocs build --strict
