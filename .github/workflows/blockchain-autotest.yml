name: Blockchain Autotest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Result type
        required: true
        default: preview
        type: choice
        options:
          - preview
          - final
      scope:
        description: Labs or assignments to check
        required: true
        default: all
        type: choice
        options:
          - all
          - labs
          - assignments
          - lab1
          - lab2
          - lab3
          - lab4
          - lab5
          - lab6
          - lab7
          - lab8
          - lab9
          - lab10
          - lab11
          - lab12
          - assignment1
          - assignment2
          - assignment3
          - assignment4

permissions:
  contents: read

concurrency:
  group: blockchain-autotest
  cancel-in-progress: false

jobs:
  autotest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autotest.txt

      - name: Install checker dependencies
        run: python -m pip install -r requirements-autotest.txt

      - name: Read roster, reports, and blockchain evidence
        id: autotest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          COURSE_STUDENTS_SPREADSHEET_ID: ${{ secrets.COURSE_STUDENTS_SPREADSHEET_ID }}
          GOOGLE_RESULTS_SPREADSHEET_ID: ${{ secrets.GOOGLE_RESULTS_SPREADSHEET_ID }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERNAUT_START_BLOCK: ${{ vars.ETHERNAUT_START_BLOCK }}
        run: >-
          python scripts/course_autotest.py
          --mode "${{ inputs.mode }}"
          --scope "${{ inputs.scope }}"

      - name: Upload machine-readable audit trail
        uses: actions/upload-artifact@v4
        with:
          name: autotest-${{ inputs.mode }}-${{ inputs.scope }}-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Add result link to workflow summary
        env:
          RESULT_TITLE: ${{ steps.autotest.outputs.result_title }}
          RESULT_URL: ${{ steps.autotest.outputs.result_url }}
        run: |
          echo "## $RESULT_TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the Google Sheet with results]($RESULT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow artifact contains the pinned input and result snapshots." >> "$GITHUB_STEP_SUMMARY"
