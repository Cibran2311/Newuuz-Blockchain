name: Blockchain Autotest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Result type
        required: true
        default: preview
        type: choice
        options:
          - preview
          - final
      scope:
        description: Checks to run
        required: true
        default: all
        type: choice
        options:
          - all
          - assignment1
          - ethernaut

permissions:
  contents: read

concurrency:
  group: blockchain-autotest
  cancel-in-progress: false

jobs:
  autotest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autotest.txt

      - name: Install checker dependencies
        run: python -m pip install -r requirements-autotest.txt

      - name: Read roster and update result spreadsheet
        id: autotest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          COURSE_STUDENTS_SPREADSHEET_ID: ${{ secrets.COURSE_STUDENTS_SPREADSHEET_ID }}
          GOOGLE_RESULTS_SPREADSHEET_ID: ${{ secrets.GOOGLE_RESULTS_SPREADSHEET_ID }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          ETHERNAUT_START_BLOCK: ${{ vars.ETHERNAUT_START_BLOCK }}
        run: >-
          python scripts/course_autotest.py
          --mode "${{ inputs.mode }}"
          --scope "${{ inputs.scope }}"

      - name: Add result link to workflow summary
        env:
          RESULT_TITLE: ${{ steps.autotest.outputs.result_title }}
          RESULT_URL: ${{ steps.autotest.outputs.result_url }}
        run: |
          echo "## $RESULT_TITLE" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the Google Sheet with results]($RESULT_URL)" >> "$GITHUB_STEP_SUMMARY"
