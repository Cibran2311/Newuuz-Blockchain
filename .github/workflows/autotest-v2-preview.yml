name: Autotest v2 Sheets access smoke test

on:
  push:
    branches:
      - preview-test-run
    paths:
      - ".github/workflows/autotest-v2-preview.yml"
  pull_request:
    branches:
      - sheets-json-autotest-v2
    paths:
      - ".github/workflows/autotest-v2-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autotest.txt

      - name: Install checker dependencies
        run: python -m pip install -r requirements-autotest.txt

      - name: Run safe Sheets preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          COURSE_STUDENTS_SPREADSHEET_ID: ${{ secrets.COURSE_STUDENTS_SPREADSHEET_ID }}
          GOOGLE_RESULTS_SPREADSHEET_ID: ${{ secrets.GOOGLE_RESULTS_SPREADSHEET_ID }}
        run: python scripts/course_autotest.py --mode preview --scope lab2

      - name: Upload audit trail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-v2-sheets-smoke-${{ github.run_id }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 7
