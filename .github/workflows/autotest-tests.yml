name: Autotest Unit Tests

on:
  pull_request:
    paths:
      - "scripts/course_autotest.py"
      - "tests/test_course_autotest.py"
      - "schemas/submission.schema.json"
      - "requirements-autotest.txt"
      - ".github/workflows/autotest-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout course repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-autotest.txt

      - name: Install checker dependencies
        run: python -m pip install -r requirements-autotest.txt

      - name: Run course autotest unit tests
        run: python -m unittest discover -s tests -p "test_course_autotest.py" -v
