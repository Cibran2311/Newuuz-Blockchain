name: Check submission.json

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate submission.json
        run: python scripts/check_submission_json.py
